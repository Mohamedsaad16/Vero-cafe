<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
</head>
<body>
    
    <form method="post">
        <label for="user">Name:</label><br>
        <input type="text" name="username" id="user" required placeholder="Name">
        <br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" required placeholder="Email">
        <br><br>
        <label for="pass">Password:</label><br>
        <input type="password" name="password" id="pass" required placeholder="Password">
        <br><br>
        <label for="pass">Confirm Password:</label><br>
        <input type="password" name="confirm-password" id="pass" required placeholder="Confirm Password">
        <br><br>
        <label for="phone">Phone:</label><br>
        <input type="tel" name="phone" id="phone" placeholder="Phone" minlength="11" maxlength="11">
         <br>
         <br>
        <button type="submit">Create Account</button>
    </form>
</body>
</html>
